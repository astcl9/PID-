[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-visualization"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pandas>=2.0", "numpy>=1.24", "pyarrow>=14", "duckdb>=1.0", "psycopg[binary]>=3.2", "python-multipart>=0.0.9", "openpyxl>=3.1", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*", "scripts*", "docs*"]
